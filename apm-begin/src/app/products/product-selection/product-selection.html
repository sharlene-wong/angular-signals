<div class="content">
  <div class="title">
    {{pageTitle}}
  </div>
  <div class="grid">
    <div class="row">
      <div class="cellFull">
        <select
          [(ngModel)]="selectedProduct"><!-- the name of the signal = "selectedProduct" we are binding to, not only reading it-->
          <option value="undefined" selected>--Select a product--</option>
          @for(product of products(); track product.id) {
          <option [ngValue]="product">{{ product.productName }}</option>
          }
        </select>
      </div>
    </div>
    <div class="row">
      <div class="cellLeft">Name:</div>
      <div class="cellRight">{{ selectedProduct()?.productName }}</div>
    </div>
    <div class="row">
      <div class="cellLeft">Description:</div>
      <div class="cellRight">{{ selectedProduct()?.description }}</div>
    </div>
    <div class="row">
      <div class="cellLeft">Price:</div>
      <div class="cellRight">{{ selectedProduct()?.price }}</div>
    </div>
    <div class="row">
      <div class="cellLeft"><label for="quantity">Quantity:</label></div>
      <div class="cellRight">
        <div class="inputContainer">
          <button class="qtyButton qtyButtonLeft" (click)="onDecrease()">-</button>
          <input type="number" id="quantity" class="quantityInput"
            [(ngModel)]="quantity"><!-- the name of the signal = "quantity" we are binding to, not only reading it-->
          <button class="qtyButton qtyButtonRight" (click)="onIncrease()">+</button>
        </div>
      </div>
    </div>
  </div>
</div>
